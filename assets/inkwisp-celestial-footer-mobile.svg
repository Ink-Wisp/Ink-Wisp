<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Inkwisp 移动端页脚信号图</title><desc id="desc">硬件、软件与连接构成的动态信号链。</desc>
  <defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0C130F"/><stop offset=".5" stop-color="#172119"/><stop offset="1" stop-color="#0C130F"/></linearGradient><filter id="fg" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="758" height="268" rx="24" fill="url(#fb)" stroke="#314037" stroke-width="2"/><path d="M72 66H688" stroke="#657763" stroke-width="1.5" stroke-dasharray="4 9"/>
  <g fill="#101812" stroke="#A8C96A" stroke-width="2"><circle cx="178" cy="66" r="9"/><circle cx="380" cy="66" r="9"/><circle cx="582" cy="66" r="9"/></g><g fill="#C5D99A"><circle cx="178" cy="66" r="3.5"/><circle cx="380" cy="66" r="3.5"/><circle cx="582" cy="66" r="3.5"/></g>
  <circle cy="66" r="5" fill="#F4F7F1" filter="url(#fg)"><animate attributeName="cx" values="72;178;380;582;688" dur="7s" repeatCount="indefinite"/></circle>
  <g font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" text-anchor="middle"><text x="178" y="101" fill="#75857B" font-size="14">硬件</text><text x="380" y="101" fill="#75857B" font-size="14">软件</text><text x="582" y="101" fill="#75857B" font-size="14">连接</text><text x="380" y="158" fill="#E8EDE6" font-size="22" font-weight="600">让每一个信号</text><text x="380" y="192" fill="#E8EDE6" font-size="22" font-weight="600">都抵达它该去的地方。</text><text x="380" y="231" fill="#7F9084" font-size="12" letter-spacing="2">INKWISP · HARDWARE × SOFTWARE × CONNECTION</text></g>
</svg>

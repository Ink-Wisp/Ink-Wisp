<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
  <title id="title">Inkwisp 移动端嵌入式系统星图</title><desc id="desc">为窄屏重新排列的品牌、轨道节点和信号链。</desc>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111A15"/><stop offset=".58" stop-color="#0B120E"/><stop offset="1" stop-color="#172119"/></linearGradient>
    <radialGradient id="mhalo"><stop stop-color="#A8C96A" stop-opacity=".2"/><stop offset="1" stop-color="#A8C96A" stop-opacity="0"/></radialGradient>
    <pattern id="mgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#53645A" stroke-width="1" stroke-opacity=".12"/><circle r="1" fill="#A8C96A" fill-opacity=".22"/></pattern>
    <filter id="mglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="758" height="978" rx="28" fill="url(#mbg)" stroke="#314037" stroke-width="2"/><rect x="20" y="20" width="720" height="940" rx="18" fill="url(#mgrid)"/>
  <g font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="54" y="70" fill="#829486" font-size="14" font-weight="600" letter-spacing="3">INKWISP / SYSTEM CHART 01</text><path d="M54 90H300" stroke="#526458"/><circle cx="312" cy="90" r="3" fill="#A8C96A"/>
    <text x="50" y="176" fill="#F2F5F0" font-size="68" font-weight="700" letter-spacing="10">INKWISP</text>
    <text x="54" y="228" fill="#C5D99A" font-size="27" font-weight="600" letter-spacing="3">嵌入式系统工程师</text>
    <text x="54" y="275" fill="#9BAC9F" font-size="21">嵌入式系统 · Linux · IoT · 边缘计算</text>
    <text x="54" y="318" fill="#D9E1DA" font-size="20">构建硬件，编写软件，连接万物。</text>
  </g>
  <g transform="translate(380 600)">
    <ellipse rx="300" ry="176" fill="url(#mhalo)"/>
    <ellipse rx="258" ry="116" fill="none" stroke="#70846F" stroke-width="2" stroke-dasharray="7 10" transform="rotate(-9)"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="18s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="138" ry="230" fill="none" stroke="#4C6051" stroke-width="1.5" stroke-dasharray="4 9" transform="rotate(28)"><animate attributeName="stroke-dashoffset" from="0" to="110" dur="24s" repeatCount="indefinite"/></ellipse>
    <circle r="78" fill="#101812" stroke="#A8C96A" stroke-width="2"/><circle r="60" fill="none" stroke="#A8C96A" stroke-opacity=".27"/><circle r="94" fill="none" stroke="#A8C96A" stroke-opacity=".15"><animate attributeName="r" values="84;102;84" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="5s" repeatCount="indefinite"/></circle>
    <g font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" text-anchor="middle"><text y="-9" fill="#C5D99A" font-size="17" font-weight="700" letter-spacing="2">系统核心</text><text y="21" fill="#F2F5F0" font-size="14" letter-spacing="1.5">EMBEDDED</text></g>
    <g font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      <g transform="translate(-250 -8)"><circle r="10" fill="#111A15" stroke="#A8C96A" stroke-width="2"/><circle r="4" fill="#C5D99A"/><text y="-23" fill="#C5D99A">MCU</text><text y="35" fill="#718078">设备节点</text></g>
      <g transform="translate(98 -198)"><circle r="10" fill="#111A15" stroke="#A8C96A" stroke-width="2"/><circle r="4" fill="#C5D99A"/><text y="-23" fill="#C5D99A">LINUX</text><text y="35" fill="#718078">系统节点</text></g>
      <g transform="translate(256 31)"><circle r="10" fill="#111A15" stroke="#A8C96A" stroke-width="2"/><circle r="4" fill="#C5D99A"/><text y="-23" fill="#C5D99A">IoT</text><text y="35" fill="#718078">连接节点</text></g>
      <g transform="translate(-90 205)"><circle r="10" fill="#111A15" stroke="#A8C96A" stroke-width="2"/><circle r="4" fill="#C5D99A"/><text y="-23" fill="#C5D99A">EDGE</text><text y="35" fill="#718078">边缘节点</text></g>
    </g>
    <circle cx="-250" cy="-8" r="5" fill="#F4F7F1" filter="url(#mglow)"><animateTransform attributeName="transform" type="rotate" from="0 250 8" to="360 250 8" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(76 894)" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif"><path d="M0 0H608" stroke="#61725F" stroke-width="2"/><g fill="#101812" stroke="#A8C96A" stroke-width="2"><circle cx="0" r="7"/><circle cx="202" r="7"/><circle cx="405" r="7"/><circle cx="608" r="7"/></g><g fill="#84958A" font-size="13" text-anchor="middle"><text x="0" y="31">硬件</text><text x="202" y="31">固件</text><text x="405" y="31">协议</text><text x="608" y="31">边缘应用</text></g><circle cy="0" r="4" fill="#F4F7F1" filter="url(#mglow)"><animate attributeName="cx" values="0;202;405;608" dur="5.6s" repeatCount="indefinite"/></circle></g>
</svg>

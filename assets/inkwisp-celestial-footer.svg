<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Inkwisp 页脚信号图</title><desc id="desc">硬件、软件与连接构成的动态信号链。</desc>
  <defs><linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0C130F"/><stop offset=".5" stop-color="#172119"/><stop offset="1" stop-color="#0C130F"/></linearGradient><linearGradient id="fline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3F5045"/><stop offset=".5" stop-color="#A8C96A"/><stop offset="1" stop-color="#3F5045"/></linearGradient><filter id="fglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="1198" height="188" rx="24" fill="url(#fbg)" stroke="#314037" stroke-width="2"/>
  <path d="M94 56H1106" stroke="url(#fline)" stroke-width="1.5" stroke-dasharray="3 8"/>
  <g fill="#101812" stroke="#A8C96A" stroke-width="1.5"><circle cx="318" cy="56" r="8"/><circle cx="600" cy="56" r="8"/><circle cx="882" cy="56" r="8"/></g><g fill="#C5D99A"><circle cx="318" cy="56" r="3"/><circle cx="600" cy="56" r="3"/><circle cx="882" cy="56" r="3"/></g>
  <circle cy="56" r="4" fill="#F4F7F1" filter="url(#fglow)"><animate attributeName="cx" values="94;318;600;882;1106" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;1;0" dur="7s" repeatCount="indefinite"/></circle>
  <g font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" text-anchor="middle"><text x="318" y="85" fill="#75857B" font-size="11" letter-spacing="2">硬件</text><text x="600" y="85" fill="#75857B" font-size="11" letter-spacing="2">软件</text><text x="882" y="85" fill="#75857B" font-size="11" letter-spacing="2">连接</text><text x="600" y="128" fill="#E8EDE6" font-size="20" font-weight="600" letter-spacing="2">让每一个信号，都抵达它该去的地方。</text><text x="600" y="158" fill="#7F9084" font-size="11" letter-spacing="2.4">INKWISP · BUILD HARDWARE · WRITE SOFTWARE · CONNECT EVERYTHING</text></g>
